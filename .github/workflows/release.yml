name: release

# Tag-driven immutable release pipeline.
#
# Triggers:
#   - push of a v<major>.<minor>.<patch> tag: first publication of the exact tagged
#     commit (branch-only pushes NEVER publish).
#   - workflow_dispatch with an existing tag: retry — completes an
#     interrupted draft, verifies a published release, finishes the Brew
#     distribution, or performs first publication for lowercase tags only.
#     Historical V0.0..V0.19 tags require an existing release and explicit dispatch.
#     Lowercase versions must be above 0.19.0; no alternate tags for legacy versions.
#
# Mode selection (never by event type): after trusted validation, the
# pipeline inspects the actual release state, including drafts visible only
# with push access (403/5xx/network failures never mean absence).
#   - no release -> mode=build for lowercase tags only: checkout/build/smoke
#     the exact tagged commit, then publish (draft -> complete -> publish).
#     A missing historical uppercase release is refused, never rebuilt.
#   - release exists (draft or published) -> mode=verify: NO build, NO
#     rebuild of published bytes; verify/complete from the manifest anchor
#     and, for an unfinished draft, the original attempt's retained
#     artifact (its digest is bound into the draft's notes at creation).
#
# Trust bootstrap (validation BEFORE any event-tag code runs):
#   * Orchestration (tools/release_pipeline.py) is NEVER taken from the event
#     tag. The plan job resolves the protected dev head SHA through the fixed
#     GitHub API with inline stdlib code and checks out that revision (full
#     clone, with tags) as the trusted checkout.
#   * `plan-run` then peels the event tag on that trusted checkout and
#     refuses it unless the peeled commit belongs to remote main history and
#     the committed source versions (pyproject.toml, src/portmap/__init__.py
#     and, when present, uv.lock) are exactly <major>.<minor>.<patch>. Only after
#     that does the tagged source checkout (npm/pytest/docker) execute, in a
#     read-only build job (contents: read) with no persisted credentials.
#     Planning has contents: write only to read draft release metadata; it
#     never checks out tagged source or executes tests/builds/artifacts.
#     Build and publish reuse the same captured automation SHA.
#   * The publish job revalidates the same tag identity against main history
#     inside tools/release_pipeline.py before any mutation.
#
# Release identity:
#   * New releases publish a BUILD-GENERATED manifest that is never committed
#     to the source: the builder receives paired --release-tag/--source-commit
#     provenance flags and embeds source={repository, tag, commit}; check-build
#     validates that identity against the tag and the actual built files.
#   * Historical releases (immutable V0.19) committed their manifest at the
#     tag; retries anchor to those exact tag-committed manifest bytes plus the
#     actual published asset digests and are never rewritten.
#   * New releases are created as drafts, completed with the full asset set
#     (verified by sha256 digest) and only then published. Published assets
#     are never replaced; a published release found incomplete is a hard
#     failure (never rebuilt, never attached to). An unfinished draft is
#     completed from the original attempt's retained artifact — including a
#     draft whose manifest asset upload failed, authenticated by the
#     manifest digest recorded in the draft notes. Published retries never
#     depend on CI artifacts or rebuilds.
#   * A fresh catalog rebuild must equal the tagged committed catalog_static
#     tree (Brew installs the tag SOURCE archive), and tracked source must
#     not drift during the build job (exact-tag-build), otherwise the run
#     fails before the frozen build.
#
# Jobs: plan (contents: write, trusted metadata inspection only) -> build
# (contents: read) -> publish (contents: write) -> distribution (reusable Brew
# workflow, dedicated HOMEBREW_TAP_TOKEN secret). The workflow only reports
# success after Brew finishes; retry failed distribution with the same tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish/retry; V0.0..V0.19 only retries an existing release"
        required: true
        type: string

permissions:
  contents: read

# One release at a time; never cancel an in-flight publication.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

env:
  BUILDER_IMAGE: portmap-release-builder:ci
  PIPELINE: trusted/tools/release_pipeline.py

jobs:
  plan:
    name: Validate tag and plan the run
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub only lists drafts for tokens with push access.
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      historical: ${{ steps.plan.outputs.historical }}
      mode: ${{ steps.plan.outputs.mode }}
      automation_sha: ${{ steps.trust.outputs.automation_sha }}
    steps:
      - name: Preflight the dedicated Brew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured. Refusing to build a release whose Brew distribution would fail after publication."
            exit 1
          fi

      # The automation revision is resolved FIRST, before any checkout, from
      # the fixed repository through the GitHub API (inline stdlib only). The
      # event tag is never a source of automation code.
      - name: Resolve protected automation revision
        id: trust
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          automation_sha="$(python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("GITHUB_TOKEN")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "portmap-release",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"
          request = urllib.request.Request(
              "https://api.github.com/repos/ylang-ylang/portmap/git/ref/heads/dev",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              ref = json.load(response)
          sha = (ref.get("object") or {}).get("sha")
          if not isinstance(sha, str) or len(sha) != 40 or any(
              character not in "0123456789abcdef" for character in sha
          ):
              raise SystemExit("resolved automation SHA is not a 40-hex string")
          print(sha)
          PY
          )"
          echo "automation_sha=$automation_sha" >> "$GITHUB_OUTPUT"
          echo "automation revision: ylang-ylang/portmap@dev $automation_sha"

      # Trusted orchestration checkout: the protected dev revision with the
      # full history, origin/main and all tags for tag validation.
      - name: Check out trusted orchestration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ylang-ylang/portmap
          ref: ${{ steps.trust.outputs.automation_sha }}
          path: trusted
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Bootstrap gate: peel the event tag, require the peeled commit to be
      # part of origin/main history and the committed source versions to be
      # exactly major.minor.patch — BEFORE the tagged source is ever checked out.
      # The run mode then comes from the ACTUAL release state, including
      # drafts: build only when no release exists, so retries of either
      # draft or published releases never regenerate their bytes.
      - name: Validate the tag and select the run mode
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 "$PIPELINE" --repo-root trusted plan-run \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-tag "$EVENT_TAG" \
            --event-sha "$EVENT_SHA" > plan.json
          cat plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open("plan.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key in ("tag", "version", "commit", "historical", "mode"):
                  out.write(f"{key}={plan[key]}\n")
          PY

  build:
    name: Build only when no release exists
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      commit: ${{ needs.plan.outputs.commit }}
      historical: ${{ needs.plan.outputs.historical }}
      mode: ${{ needs.plan.outputs.mode }}
      automation_sha: ${{ needs.plan.outputs.automation_sha }}
    steps:
      # Keep this job successful in verify mode: publish still needs its
      # aliased plan outputs even when every build-only step is skipped.
      - name: Record the selected run mode
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: echo "Release mode=$MODE"

      # Reuse the exact approved orchestration revision captured by plan.
      # No source, dependency, test or artifact code gets write permission.
      - name: Check out trusted build orchestration
        if: needs.plan.outputs.mode == 'build'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ylang-ylang/portmap
          ref: ${{ needs.plan.outputs.automation_sha }}
          path: trusted
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Everything below only runs when NO release exists for the tag yet
      # (mode=build): the exact validated commit is built for the first time.
      # Existing drafts/published releases go straight to the publish job.
      - name: Check out the validated tagged commit
        if: needs.plan.outputs.mode == 'build'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ylang-ylang/portmap
          ref: ${{ needs.plan.outputs.commit }}
          path: source
          persist-credentials: false

      - name: Set up Node
        if: needs.plan.outputs.mode == 'build'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Rebuild the catalog from the tagged source
        if: needs.plan.outputs.mode == 'build'
        working-directory: source
        run: |
          npm ci
          npm run build
          test -f src/portmap/catalog_static/skills/project-integration/SKILL.md
          test -f src/portmap/catalog_static/assets/catalog.js

      # Brew installs the GitHub tag SOURCE archive: the committed
      # catalog_static tree must equal a fresh rebuild, otherwise the frozen
      # bundle would ship a new UI while Brew/source installs silently ship
      # a stale one. Maintainers run npm ci && npm run build before tagging.
      - name: Require the rebuilt catalog to equal the tagged tree
        if: needs.plan.outputs.mode == 'build'
        run: python3 "$PIPELINE" --repo-root source check-catalog

      - name: Run the full non-integration test suite
        if: needs.plan.outputs.mode == 'build'
        working-directory: source
        run: |
          # Ubuntu 24.04 supplies Python 3.12 and Git; run tests as the runner,
          # not root in the legacy-glibc packaging container.
          python3 -m venv "$RUNNER_TEMP/portmap-tests"
          "$RUNNER_TEMP/portmap-tests/bin/pip" install --no-cache-dir -e ".[test]"
          "$RUNNER_TEMP/portmap-tests/bin/python" -m pytest -m "not integration"

      # Exact-tag-build: tests or the rebuild must not have modified any
      # TRACKED file (untracked node_modules/dist stay usable); the frozen
      # archive is built from the exact tagged tree or not at all.
      - name: Reject tracked source drift before the frozen build
        if: needs.plan.outputs.mode == 'build'
        run: python3 "$PIPELINE" --repo-root source check-source

      - name: Build the frozen linux-amd64 archive with provenance
        if: needs.plan.outputs.mode == 'build'
        working-directory: source
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          # The Dockerfile only pins the build environment (no COPY), so the
          # build context is the small packaging directory.
          docker build --pull -f packaging/portmap.Dockerfile -t "$BUILDER_IMAGE" packaging
          mkdir -p dist
          # The build tool stages its own static tree under the out dir; the
          # source mount stays read-only. Paired provenance flags make the
          # builder verify HEAD/version and embed the source identity block.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            "$BUILDER_IMAGE" --out-dir /out \
            --release-tag "$TAG" --source-commit "$COMMIT"

      - name: Validate the built manifest against the tag identity
        if: needs.plan.outputs.mode == 'build'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          python3 "$PIPELINE" --repo-root source check-build \
            --tag "$TAG" --commit "$COMMIT" --assets-dir source/dist

      - name: Runtime-gate the actual frozen artifact
        if: needs.plan.outputs.mode == 'build'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Execute the built binary once on an owned loopback listener:
          # --version must match the plan and its catalog server must serve
          # the canonical rendered skill over HTTP 200 Markdown. Runs ONLY
          # in this contents:read job; the publish job never executes
          # artifact code.
          python3 "$PIPELINE" --repo-root source smoke-build \
            --version "$VERSION" --dist-dir source/dist

      # The attempt suffix keeps every re-run's bytes distinct: an
      # interrupted draft is completed from ITS OWN attempt's artifact, never
      # from a rebuild with different bytes.
      - name: Retain the release assets
        if: needs.plan.outputs.mode == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/dist/*.tar.gz
            source/dist/*.sha256
            source/dist/release.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish:
    name: Publish or complete the immutable GitHub release
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read # cross-run artifact recovery for interrupted drafts
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      # Same protected automation revision the plan job resolved; the
      # publication token is never exposed to source or artifact code.
      # tools/release_pipeline.py revalidates the tag against main history
      # and the committed source versions before any mutation below.
      - name: Check out trusted orchestration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ylang-ylang/portmap
          ref: ${{ needs.build.outputs.automation_sha }}
          path: trusted
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Export runtime release paths
        run: |
          # runner.temp is unavailable in job-level env; export it per run.
          echo "ASSETS_DIR=${RUNNER_TEMP}/release-assets" >> "$GITHUB_ENV"

      - name: Inspect the tagged release
        id: inspect
        run: |
          python3 "$PIPELINE" --repo-root trusted inspect-release \
            --tag "$TAG" > inspect.json
          cat inspect.json
          python3 - <<'PY'
          import json, os
          result = json.load(open("inspect.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"recover_artifact={result['recover_artifact'] or ''}\n")
              out.write(f"origin_run_id={result['origin_run_id'] or ''}\n")
              out.write(f"missing={','.join(result['missing'])}\n")
          PY

      - name: Download this run's release assets
        if: needs.build.outputs.mode == 'build'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets

      # Only an unfinished DRAFT recovers the original attempt's retained
      # artifact bytes — including a draft whose manifest asset upload
      # failed (its manifest digest is bound in the draft notes); published
      # releases verify to a no-op and never depend on CI artifacts or
      # rebuilds.
      - name: Recover the original attempt's retained assets
        if: steps.inspect.outputs.recover_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.inspect.outputs.recover_artifact }}
          run-id: ${{ steps.inspect.outputs.origin_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish or complete the release without clobbering assets
        run: |
          python3 "$PIPELINE" --repo-root trusted publish-release \
            --tag "$TAG" --assets-dir "$ASSETS_DIR" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"

  distribution:
    name: Update the Brew tap through the reusable workflow
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/release-distribution.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
