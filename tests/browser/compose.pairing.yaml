# Pairing proof: actual node CLI output, never a JS-fabricated success code.
# These credentials belong only to disposable fixtures. Keep even these codes private.
services:
  node-a:
    user: ${BROWSER_UID:?Use run.sh}:${BROWSER_GID:?Use run.sh}
    command: [sh, -c, "umask 077; cp /app/tests/browser/node-a.json /tmp/browser-proxy.json && exec python -m portmap.cli browser-proxy --config /tmp/browser-proxy.json --pair --advertise-host node-a > /pairing/node-a.code"]
    volumes:
      - ${BROWSER_PAIRING_DIR:?Use run.sh}:/pairing
  node-b:
    user: ${BROWSER_UID:?Use run.sh}:${BROWSER_GID:?Use run.sh}
    command: [sh, -c, "umask 077; cp /app/tests/browser/node-b.json /tmp/browser-proxy.json && exec python -m portmap.cli browser-proxy --config /tmp/browser-proxy.json --pair --advertise-host node-b > /pairing/node-b.code"]
    volumes:
      - ${BROWSER_PAIRING_DIR:?Use run.sh}:/pairing
