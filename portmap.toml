[gateway]
# LAN HTTP requires an exact non-loopback address; wildcard keeps it private.
http_bind = "0.0.0.0"
http_port = 80
network = "portmap_gateway"

# Container runtime for the gateway and managed projects.
# backend = "auto" probes: DOCKER_HOST -> /var/run/docker.sock
#   -> $XDG_RUNTIME_DIR/podman/podman.sock -> /run/podman/podman.sock.
# Set backend = "podman" on hosts that run Podman instead of dockerd.
# Podman hosts still use the docker compose CLI as the client; the CLI is
# pointed at the Podman socket through DOCKER_HOST.
# [runtime]
# backend = "auto"
# socket = "/run/user/1000/podman/podman.sock"

# Normal setup/run uses runtime HTTP ingress and Linux original-DNS forwarding.
# No backend choice is required. Owned legacy selections retain compatibility.
# [access]
# resolver = "auto"     # auto | resolved | forward | external
# ingress = "auto"      # auto | container | systemd
# Host DNS uses loopback UDP/TCP 53 and needs authorized resolver-file writes.
# Fresh server-only `up` does not take over host DNS.
# resolved/external/systemd remain advanced or legacy compatibility options.

[ports]
tcp_start = 18000
udp_start = 19000
range_start = 49160

[state]
dir = "~/.local/state/portmap"
